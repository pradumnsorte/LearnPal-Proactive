<svg xmlns="http://www.w3.org/2000/svg" width="1386" height="372" viewBox="0 0 1386 372" role="img" aria-label="Per-prototype learning hypotheses">
  <rect width="1386" height="372" fill="#f7f4eb"/>
  <rect x="16" y="16" width="1354" height="340" rx="10" fill="#ffffff" stroke="#ded7c8"/>
  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">Per-prototype learning hypotheses</text>
  <rect x="28" y="56" width="140" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Prototype</tspan></text><rect x="168" y="56" width="330" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="180" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="180" dy="0">Null hypothesis (H0)</tspan></text><rect x="498" y="56" width="330" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="510" dy="0">Alternative hypothesis (H1)</tspan></text><rect x="828" y="56" width="300" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="840" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="840" dy="0">Evidence</tspan></text><rect x="1128" y="56" width="230" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="1140" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="1140" dy="0">Decision at alpha = 0.05</tspan></text>
<rect x="28" y="98" width="140" height="106" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Intermittent</tspan></text><rect x="168" y="98" width="330" height="106" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="180" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="180" dy="0">Intermittent does not produce a</tspan><tspan x="180" dy="18">statistically significant pre-test to</tspan><tspan x="180" dy="18">post-test learning improvement.</tspan></text><rect x="498" y="98" width="330" height="106" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">Intermittent produces a statistically</tspan><tspan x="510" dy="18">significant pre-test to post-test learning</tspan><tspan x="510" dy="18">improvement.</tspan></text><rect x="828" y="98" width="300" height="106" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="840" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="840" dy="0">Mean gain +3.43; median gain +4.00;</tspan><tspan x="840" dy="18">Wilcoxon exact p = 0.1875.</tspan></text><rect x="1128" y="98" width="230" height="106" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1140" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1140" dy="0">Fail to reject H0 Descriptive</tspan><tspan x="1140" dy="18">improvement is still visible,</tspan><tspan x="1140" dy="18">but the test is not</tspan><tspan x="1140" dy="18">significant in this small</tspan><tspan x="1140" dy="18">sample.</tspan></text>
<rect x="28" y="204" width="140" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="221" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Continuous</tspan></text><rect x="168" y="204" width="330" height="70" fill="#eaf1ff" stroke="#ddd6c7" stroke-width="1"/><text x="180" y="221" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="180" dy="0">Continuous does not produce a statistically</tspan><tspan x="180" dy="18">significant pre-test to post-test learning</tspan><tspan x="180" dy="18">improvement.</tspan></text><rect x="498" y="204" width="330" height="70" fill="#eaf1ff" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="221" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">Continuous produces a statistically</tspan><tspan x="510" dy="18">significant pre-test to post-test learning</tspan><tspan x="510" dy="18">improvement.</tspan></text><rect x="828" y="204" width="300" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="840" y="221" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="840" dy="0">Mean gain +4.29; median gain +4.00;</tspan><tspan x="840" dy="18">Wilcoxon exact p = 0.0313.</tspan></text><rect x="1128" y="204" width="230" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1140" y="221" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1140" dy="0">Reject H0</tspan></text>
<rect x="28" y="274" width="140" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="291" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Proactive</tspan></text><rect x="168" y="274" width="330" height="70" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="180" y="291" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="180" dy="0">Proactive does not produce a statistically</tspan><tspan x="180" dy="18">significant pre-test to post-test learning</tspan><tspan x="180" dy="18">improvement.</tspan></text><rect x="498" y="274" width="330" height="70" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="291" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">Proactive produces a statistically</tspan><tspan x="510" dy="18">significant pre-test to post-test learning</tspan><tspan x="510" dy="18">improvement.</tspan></text><rect x="828" y="274" width="300" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="840" y="291" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="840" dy="0">Mean gain +5.71; median gain +4.00;</tspan><tspan x="840" dy="18">Wilcoxon exact p = 0.0313.</tspan></text><rect x="1128" y="274" width="230" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1140" y="291" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1140" dy="0">Reject H0</tspan></text>
</svg>
