<svg xmlns="http://www.w3.org/2000/svg" width="1666" height="416" viewBox="0 0 1666 416" role="img" aria-label="Cross-condition hypothesis decisions">
  <rect width="1666" height="416" fill="#f7f4eb"/>
  <rect x="16" y="16" width="1634" height="384" rx="10" fill="#ffffff" stroke="#ded7c8"/>
  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">Cross-condition hypothesis decisions</text>
  <rect x="28" y="56" width="210" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Comparison</tspan></text><rect x="238" y="56" width="330" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="250" dy="0">Null hypothesis (H0)</tspan></text><rect x="568" y="56" width="330" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="580" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="580" dy="0">Alternative hypothesis (H1)</tspan></text><rect x="898" y="56" width="260" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="910" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="910" dy="0">Evidence</tspan></text><rect x="1158" y="56" width="180" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="1170" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="1170" dy="0">Decision at alpha =</tspan><tspan x="1170" dy="18">0.05</tspan></text><rect x="1338" y="56" width="300" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="1350" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="1350" dy="0">Reading</tspan></text>
<rect x="28" y="108" width="210" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Learning difference</tspan><tspan x="40" dy="18">between prototypes</tspan></text><rect x="238" y="108" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">The three prototypes produce the same</tspan><tspan x="250" dy="18">learning outcomes.</tspan></text><rect x="568" y="108" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="580" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="580" dy="0">At least one prototype produces different</tspan><tspan x="580" dy="18">learning outcomes.</tspan></text><rect x="898" y="108" width="260" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="910" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="910" dy="0">Raw gain p = 0.7021; normalised</tspan><tspan x="910" dy="18">gain p = 0.5581.</tspan></text><rect x="1158" y="108" width="180" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1170" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1170" dy="0">Fail to reject H0</tspan></text><rect x="1338" y="108" width="300" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1350" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1350" dy="0">No prototype can be claimed as</tspan><tspan x="1350" dy="18">statistically superior for learning from</tspan><tspan x="1350" dy="18">this sample.</tspan></text>
<rect x="28" y="178" width="210" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Perceived control</tspan><tspan x="40" dy="18">difference</tspan></text><rect x="238" y="178" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">The three prototypes produce the same</tspan><tspan x="250" dy="18">perceived control.</tspan></text><rect x="568" y="178" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="580" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="580" dy="0">At least one prototype changes perceived</tspan><tspan x="580" dy="18">control.</tspan></text><rect x="898" y="178" width="260" height="70" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="910" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="910" dy="0">AI control p = 0.0425;</tspan><tspan x="910" dy="18">Intermittent mean control =</tspan><tspan x="910" dy="18">4.57/5.</tspan></text><rect x="1158" y="178" width="180" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1170" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1170" dy="0">Reject H0</tspan></text><rect x="1338" y="178" width="300" height="70" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="1350" y="195" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1350" dy="0">Control differed by condition, with</tspan><tspan x="1350" dy="18">Intermittent highest.</tspan></text>
<rect x="28" y="248" width="210" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Distraction difference</tspan></text><rect x="238" y="248" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">The three prototypes produce the same</tspan><tspan x="250" dy="18">distraction level.</tspan></text><rect x="568" y="248" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="580" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="580" dy="0">At least one prototype changes distraction.</tspan></text><rect x="898" y="248" width="260" height="70" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="910" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="910" dy="0">AI distraction p = 0.0221;</tspan><tspan x="910" dy="18">Intermittent mean distraction =</tspan><tspan x="910" dy="18">1.29/5.</tspan></text><rect x="1158" y="248" width="180" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1170" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1170" dy="0">Reject H0</tspan></text><rect x="1338" y="248" width="300" height="70" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="1350" y="265" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1350" dy="0">Distraction differed by condition, with</tspan><tspan x="1350" dy="18">Intermittent lowest.</tspan></text>
<rect x="28" y="318" width="210" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Interaction-pattern</tspan><tspan x="40" dy="18">difference</tspan></text><rect x="238" y="318" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">The three prototypes produce the same</tspan><tspan x="250" dy="18">feature activity/exposure.</tspan></text><rect x="568" y="318" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="580" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="580" dy="0">At least one prototype produces a different</tspan><tspan x="580" dy="18">interaction pattern.</tspan></text><rect x="898" y="318" width="260" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="910" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="910" dy="0">Feature activity p &lt; 0.0001;</tspan><tspan x="910" dy="18">epsilon^2 = 0.89.</tspan></text><rect x="1158" y="318" width="180" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1170" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1170" dy="0">Reject H0</tspan></text><rect x="1338" y="318" width="300" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1350" y="335" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1350" dy="0">The prototype manipulation clearly</tspan><tspan x="1350" dy="18">changed behaviour, even though learning</tspan><tspan x="1350" dy="18">differences were not significant.</tspan></text>
</svg>
