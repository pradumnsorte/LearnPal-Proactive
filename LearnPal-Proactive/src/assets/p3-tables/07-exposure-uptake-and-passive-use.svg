<svg xmlns="http://www.w3.org/2000/svg" width="1556" height="474" viewBox="0 0 1556 474" role="img" aria-label="Exposure uptake and passive use">
  <rect width="1556" height="474" fill="#f7f4eb"/>
  <rect x="16" y="16" width="1524" height="442" rx="10" fill="#ffffff" stroke="#ded7c8"/>
  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">Exposure uptake and passive use</text>
  <rect x="28" y="56" width="130" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Condition</tspan></text><rect x="158" y="56" width="140" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="170" dy="0">Feature</tspan></text><rect x="298" y="56" width="285" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="310" dy="0">AI exposure / opportunity</tspan></text><rect x="583" y="56" width="310" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="595" dy="0">Explicit positive uptake</tspan></text><rect x="893" y="56" width="300" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="905" dy="0">Non-engagement / friction</tspan></text><rect x="1193" y="56" width="335" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="1205" dy="0">Passive-use caveat</tspan></text>
<rect x="28" y="98" width="130" height="52" fill="#eaf1ff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Continuous</tspan></text><rect x="158" y="98" width="140" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Feed questions</tspan></text><rect x="298" y="98" width="285" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">66 questions unlocked</tspan></text><rect x="583" y="98" width="310" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">48 answered, 8 explanation clicks, 40</tspan><tspan x="595" dy="18">jumps</tspan></text><rect x="893" y="98" width="300" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">Unanswered questions are not</tspan><tspan x="905" dy="18">automatically rejection.</tspan></text><rect x="1193" y="98" width="335" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">A question may still have prompted thinking</tspan><tspan x="1205" dy="18">even without a logged answer.</tspan></text>
<rect x="28" y="150" width="130" height="70" fill="#eaf1ff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Continuous</tspan></text><rect x="158" y="150" width="140" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Glossary</tspan></text><rect x="298" y="150" width="285" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">Terms were surfaced visually;</tspan><tspan x="310" dy="18">shown-count is not exported.</tspan></text><rect x="583" y="150" width="310" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">19 glossary clicks</tspan></text><rect x="893" y="150" width="300" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">No close/dismiss metric.</tspan></text><rect x="1193" y="150" width="335" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">Reading visible terms without clicking is</tspan><tspan x="1205" dy="18">likely undercounted; interview notes support</tspan><tspan x="1205" dy="18">clarification/revision use.</tspan></text>
<rect x="28" y="220" width="130" height="52" fill="#eaf1ff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Continuous</tspan></text><rect x="158" y="220" width="140" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Highlights</tspan></text><rect x="298" y="220" width="285" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">Highlights were surfaced visually.</tspan></text><rect x="583" y="220" width="310" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">6 detail clicks</tspan></text><rect x="893" y="220" width="300" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">No direct rejection metric.</tspan></text><rect x="1193" y="220" width="335" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="237" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">May support orientation without a detail</tspan><tspan x="1205" dy="18">click.</tspan></text>
<rect x="28" y="272" width="130" height="70" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Proactive</tspan></text><rect x="158" y="272" width="140" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Keyword popups</tspan></text><rect x="298" y="272" width="285" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">154 keywords shown</tspan></text><rect x="583" y="272" width="310" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">21 later/pinned/detail actions (14%)</tspan></text><rect x="893" y="272" width="300" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">133 ignored/dismissed</tspan></text><rect x="1193" y="272" width="335" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="289" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">Ignored/dismissed may include</tspan><tspan x="1205" dy="18">read-then-dismiss, but interview notes</tspan><tspan x="1205" dy="18">indicate weak reception.</tspan></text>
<rect x="28" y="342" width="130" height="52" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Proactive</tspan></text><rect x="158" y="342" width="140" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Quiz prompts</tspan></text><rect x="298" y="342" width="285" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">75 quizzes triggered</tspan></text><rect x="583" y="342" width="310" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">57 answered</tspan></text><rect x="893" y="342" width="300" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">7 skipped</tspan></text><rect x="1193" y="342" width="335" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">Stronger uptake because the intervention was</tspan><tspan x="1205" dy="18">structured as a learning checkpoint.</tspan></text>
<rect x="28" y="394" width="130" height="52" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Proactive</tspan></text><rect x="158" y="394" width="140" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="170" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="170" dy="0">Visual cues</tspan></text><rect x="298" y="394" width="285" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="310" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="310" dy="0">13 visual cards opened</tspan></text><rect x="583" y="394" width="310" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="595" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="595" dy="0">3 detail/saved actions</tspan></text><rect x="893" y="394" width="300" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="905" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="905" dy="0">11 closed</tspan></text><rect x="1193" y="394" width="335" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="1205" y="411" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="1205" dy="0">Small counts; useful as supporting evidence</tspan><tspan x="1205" dy="18">only.</tspan></text>
</svg>
