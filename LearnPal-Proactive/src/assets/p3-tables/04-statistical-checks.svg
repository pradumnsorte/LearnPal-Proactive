<svg xmlns="http://www.w3.org/2000/svg" width="1146" height="462" viewBox="0 0 1146 462" role="img" aria-label="Statistical checks">
  <rect width="1146" height="462" fill="#f7f4eb"/>
  <rect x="16" y="16" width="1114" height="430" rx="10" fill="#ffffff" stroke="#ded7c8"/>
  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">Statistical checks</text>
  <rect x="28" y="56" width="240" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Question</tspan></text><rect x="268" y="56" width="230" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="280" dy="0">Test/check</tspan></text><rect x="498" y="56" width="180" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="510" dy="0">Result</tspan></text><rect x="678" y="56" width="440" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="690" dy="0">Why this test</tspan></text>
<rect x="28" y="98" width="240" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Did participants improve?</tspan></text><rect x="268" y="98" width="230" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Wilcoxon signed-rank</tspan></text><rect x="498" y="98" width="180" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.0002, r = 0.89</tspan></text><rect x="678" y="98" width="440" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Paired pre/post scores, small sample, bounded score scale.</tspan></text>
<rect x="28" y="136" width="240" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="153" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Does gain differ by condition?</tspan></text><rect x="268" y="136" width="230" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="153" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="136" width="180" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="153" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.7021, epsilon^2</tspan><tspan x="510" dy="18">= 0.00</tspan></text><rect x="678" y="136" width="440" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="153" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Three independent groups, small N, non-normal counts/scores</tspan><tspan x="690" dy="18">likely.</tspan></text>
<rect x="28" y="188" width="240" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="205" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Does normalised gain differ?</tspan></text><rect x="268" y="188" width="230" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="205" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="188" width="180" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="205" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.5581</tspan></text><rect x="678" y="188" width="440" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="205" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Controls partly for different room to improve.</tspan></text>
<rect x="28" y="226" width="240" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="243" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Does control differ?</tspan></text><rect x="268" y="226" width="230" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="243" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="226" width="180" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="243" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.0425, epsilon^2</tspan><tspan x="510" dy="18">= 0.23</tspan></text><rect x="678" y="226" width="440" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="243" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Likert-type ratings across three groups.</tspan></text>
<rect x="28" y="278" width="240" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="295" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Does distraction differ?</tspan></text><rect x="268" y="278" width="230" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="295" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="278" width="180" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="295" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.0221, epsilon^2</tspan><tspan x="510" dy="18">= 0.30</tspan></text><rect x="678" y="278" width="440" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="295" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Likert-type ratings across three groups.</tspan></text>
<rect x="28" y="330" width="240" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Did explicit AI uptake differ?</tspan></text><rect x="268" y="330" width="230" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="330" width="180" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p = 0.0920, epsilon^2</tspan><tspan x="510" dy="18">= 0.15</tspan></text><rect x="678" y="330" width="440" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="347" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Counts only learner actions that indicate positive uptake.</tspan></text>
<rect x="28" y="382" width="240" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="399" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Did feature activity/exposure</tspan><tspan x="40" dy="18">differ?</tspan></text><rect x="268" y="382" width="230" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="280" y="399" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="280" dy="0">Permutation Kruskal-Wallis</tspan></text><rect x="498" y="382" width="180" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="510" y="399" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="510" dy="0">p &lt; 0.0001, epsilon^2</tspan><tspan x="510" dy="18">= 0.89</tspan></text><rect x="678" y="382" width="440" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="690" y="399" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="690" dy="0">Exposure/activity counts are skewed but confirm the</tspan><tspan x="690" dy="18">manipulation.</tspan></text>
</svg>
