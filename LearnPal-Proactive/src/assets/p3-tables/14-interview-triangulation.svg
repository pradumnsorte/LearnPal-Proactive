<svg xmlns="http://www.w3.org/2000/svg" width="1396" height="812" viewBox="0 0 1396 812" role="img" aria-label="Interview triangulation">
  <rect width="1396" height="812" fill="#f7f4eb"/>
  <rect x="16" y="16" width="1364" height="780" rx="10" fill="#ffffff" stroke="#ded7c8"/>
  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">Interview triangulation</text>
  <rect x="28" y="56" width="250" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Condition</tspan></text><rect x="278" y="56" width="330" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="290" dy="0">Theme</tspan></text><rect x="608" y="56" width="330" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="620" dy="0">Interview-note pattern</tspan></text><rect x="938" y="56" width="430" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="950" dy="0">How it explains the data</tspan></text>
<rect x="28" y="98" width="250" height="88" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Intermittent</tspan></text><rect x="278" y="98" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Learner-controlled help</tspan></text><rect x="608" y="98" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that chat support</tspan><tspan x="620" dy="18">was useful and Snap-to-ask was handy because</tspan><tspan x="620" dy="18">learners did not need to type visual/text</tspan><tspan x="620" dy="18">details.</tspan></text><rect x="938" y="98" width="430" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">This explains high control and low distraction, but also</tspan><tspan x="950" dy="18">why support depends on learner initiative.</tspan></text>
<rect x="28" y="186" width="250" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="203" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Intermittent</tspan></text><rect x="278" y="186" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="203" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Delayed use</tspan></text><rect x="608" y="186" width="330" height="70" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="203" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that some</tspan><tspan x="620" dy="18">participants waited until the video ended</tspan><tspan x="620" dy="18">and then took the in-video quiz all at once.</tspan></text><rect x="938" y="186" width="430" height="70" fill="#fff5cf" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="203" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">Intermittent support can become revision-like rather than</tspan><tspan x="950" dy="18">moment-by-moment support.</tspan></text>
<rect x="28" y="256" width="250" height="88" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="273" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Continuous</tspan></text><rect x="278" y="256" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="273" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Ambient engagement</tspan></text><rect x="608" y="256" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="273" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that live feed</tspan><tspan x="620" dy="18">questions kept participants engaged; when</tspan><tspan x="620" dy="18">they could not answer, they rewatched or</tspan><tspan x="620" dy="18">asked AI.</tspan></text><rect x="938" y="256" width="430" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="273" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">The feed question layer supports constructive engagement</tspan><tspan x="950" dy="18">without forcing interruption.</tspan></text>
<rect x="28" y="344" width="250" height="88" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="361" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Continuous</tspan></text><rect x="278" y="344" width="330" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="361" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Glossary as clarification and revision</tspan></text><rect x="608" y="344" width="330" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="361" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that the keyword</tspan><tspan x="620" dy="18">glossary was useful, including for</tspan><tspan x="620" dy="18">clarification and revision; one participant</tspan><tspan x="620" dy="18">wanted to download it.</tspan></text><rect x="938" y="344" width="430" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="361" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">The glossary worked both as in-the-moment explanation and</tspan><tspan x="950" dy="18">as a revision artifact.</tspan></text>
<rect x="28" y="432" width="250" height="70" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="449" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Continuous</tspan></text><rect x="278" y="432" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="449" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Visual density</tspan></text><rect x="608" y="432" width="330" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="449" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that some</tspan><tspan x="620" dy="18">participants felt a lot was going on; one</tspan><tspan x="620" dy="18">wanted feature tabs to collapse.</tspan></text><rect x="938" y="432" width="430" height="70" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="449" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">Ambient support must be visually manageable to avoid</tspan><tspan x="950" dy="18">becoming distracting.</tspan></text>
<rect x="28" y="502" width="250" height="106" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="519" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Proactive</tspan></text><rect x="278" y="502" width="330" height="106" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="519" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Structured proactivity succeeds</tspan></text><rect x="608" y="502" width="330" height="106" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="519" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes and supplementary</tspan><tspan x="620" dy="18">clarifications indicate that most</tspan><tspan x="620" dy="18">participants liked the quiz popups and the</tspan><tspan x="620" dy="18">overall quiz feature; frequency controls</tspan><tspan x="620" dy="18">were appreciated.</tspan></text><rect x="938" y="502" width="430" height="106" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="519" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">System initiative was accepted when it created clear,</tspan><tspan x="950" dy="18">controllable learning checkpoints.</tspan></text>
<rect x="28" y="608" width="250" height="88" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="625" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Proactive</tspan></text><rect x="278" y="608" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="625" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Keyword popups failed as uncontrolled</tspan><tspan x="290" dy="18">initiative</tspan></text><rect x="608" y="608" width="330" height="88" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="625" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes and supplementary</tspan><tspan x="620" dy="18">clarifications indicate that keyword popups</tspan><tspan x="620" dy="18">were distracting; nobody explicitly claimed</tspan><tspan x="620" dy="18">they helped learning.</tspan></text><rect x="938" y="608" width="430" height="88" fill="#ffe7ed" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="625" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">Proactive prompts need suppression, pacing, and stronger</tspan><tspan x="950" dy="18">timing/context logic.</tspan></text>
<rect x="28" y="696" width="250" height="88" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="713" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Across conditions</tspan></text><rect x="278" y="696" width="330" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="290" y="713" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="290" dy="0">Pacing and context continuity</tspan></text><rect x="608" y="696" width="330" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="620" y="713" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="620" dy="0">Interview notes indicate that some increased</tspan><tspan x="620" dy="18">playback speed because the video felt slow</tspan><tspan x="620" dy="18">or they wanted to finish faster; some felt</tspan><tspan x="620" dy="18">AI support became detached from the video.</tspan></text><rect x="938" y="696" width="430" height="88" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="950" y="713" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="950" dy="0">Speed and context-loss feedback should be treated as</tspan><tspan x="950" dy="18">session-flow issues, not direct learning indicators.</tspan></text>
</svg>
