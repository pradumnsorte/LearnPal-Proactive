  <text x="28" y="39" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="760" fill="#20242b">UES reliability check</text>
  <rect x="28" y="56" width="160" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Scale</tspan></text><rect x="188" y="56" width="370" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="200" dy="0">Items</tspan></text><rect x="558" y="56" width="145" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="570" dy="0">Cronbach's</tspan><tspan x="570" dy="18">&amp;alpha;</tspan></text><rect x="703" y="56" width="510" height="52" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="715" dy="0">Use in interpretation</tspan></text>
<rect x="28" y="108" width="160" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">UES overall</tspan></text><rect x="188" y="108" width="370" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="200" dy="0">12</tspan></text><rect x="558" y="108" width="145" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="570" dy="0">0.78</tspan></text><rect x="703" y="108" width="510" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="125" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="715" dy="0">Acceptable for exploratory reporting.</tspan></text>
<rect x="28" y="146" width="160" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="163" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Focused attention</tspan></text><rect x="188" y="146" width="370" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="163" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="200" dy="0">3</tspan></text><rect x="558" y="146" width="145" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="163" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="570" dy="0">0.66</tspan></text><rect x="703" y="146" width="510" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="163" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="715" dy="0">Usable but modest.</tspan></text>
<rect x="28" y="184" width="160" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="201" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Perceived usability</tspan></text><rect x="188" y="184" width="370" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="201" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="200" dy="0">3</tspan></text><rect x="558" y="184" width="145" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="201" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="570" dy="0">0.39</tspan></text><rect x="703" y="184" width="510" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="201" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="715" dy="0">Weak; avoid overinterpreting the subscale alone.</tspan></text>
<rect x="28" y="222" width="160" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Aesthetic appeal</tspan></text><rect x="188" y="222" width="370" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="200" dy="0">3</tspan></text><rect x="558" y="222" width="145" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="570" dy="0">0.84</tspan></text><rect x="703" y="222" width="510" height="38" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="239" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="715" dy="0">Strong.</tspan></text>
<rect x="28" y="260" width="160" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">Reward</tspan></text><rect x="188" y="260" width="370" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="200" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="200" dy="0">3</tspan></text><rect x="558" y="260" width="145" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="570" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="570" dy="0">0.62</tspan></text><rect x="703" y="260" width="510" height="38" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="715" y="277" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="715" dy="0">Usable but modest.</tspan></text>
