  <rect x="28" y="56" width="210" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="40" dy="0">Research question</tspan></text><rect x="238" y="56" width="300" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="250" dy="0">Data source</tspan></text><rect x="538" y="56" width="440" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="550" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="550" dy="0">Measures</tspan></text><rect x="978" y="56" width="360" height="42" fill="#f6f1e5" stroke="#ddd6c7" stroke-width="1"/><text x="990" y="73" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#22252b"><tspan x="990" dy="0">Output</tspan></text>
<rect x="28" y="98" width="210" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">RQ1 Knowledge gain</tspan></text><rect x="238" y="98" width="300" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">Form_2, Form_3, Form_4</tspan></text><rect x="538" y="98" width="440" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="550" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="550" dy="0">pre-knowledge, pre-test, post-test, raw gain, normalised</tspan><tspan x="550" dy="18">gain</tspan></text><rect x="978" y="98" width="360" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="990" y="115" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="990" dy="0">Did learning happen, and did gain differ by</tspan><tspan x="990" dy="18">paradigm?</tspan></text>
<rect x="28" y="150" width="210" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">RQ2 Engagement</tspan></text><rect x="238" y="150" width="300" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">Form_5, comparable logs,</tspan><tspan x="250" dy="18">condition-specific logs</tspan></text><rect x="538" y="150" width="440" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="550" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="550" dy="0">UES, explicit positive AI uptake, support-family uptake,</tspan><tspan x="550" dy="18">feature activity/exposure</tspan></text><rect x="978" y="150" width="360" height="52" fill="#ffffff" stroke="#ddd6c7" stroke-width="1"/><text x="990" y="167" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="990" dy="0">How did each paradigm change learner activity</tspan><tspan x="990" dy="18">and uptake?</tspan></text>
<rect x="28" y="202" width="210" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="40" y="219" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="40" dy="0">RQ3 Initiative-control</tspan><tspan x="40" dy="18">trade-off</tspan></text><rect x="238" y="202" width="300" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="250" y="219" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="250" dy="0">Form_5, logs, interview notes</tspan></text><rect x="538" y="202" width="440" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="550" y="219" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="550" dy="0">control, distraction, overload, timing, relevance,</tspan><tspan x="550" dy="18">ignored/dismissed prompts, interview-note themes</tspan></text><rect x="978" y="202" width="360" height="52" fill="#fbfaf6" stroke="#ddd6c7" stroke-width="1"/><text x="990" y="219" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500" fill="#303640"><tspan x="990" dy="0">When did AI initiative help, and when did it</tspan><tspan x="990" dy="18">disrupt?</tspan></text>
